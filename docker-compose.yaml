version: '3.8'

# ==============================================================================
# DOCKER COMPOSE - ENVIRONNEMENT DE PRODUCTION
# ==============================================================================
# Ce fichier orchestre le déploiement complet de l'application Mario Bros
# avec un Reverse Proxy Nginx et la gestion automatique des certificats SSL/TLS.
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. REVERSE PROXY NGINX (Point d'entrée unique de la VM)
  # ----------------------------------------------------------------------------
  nginx-proxy:
    container_name: nginx-reverse-proxy
    image: nginxproxy/nginx-proxy:latest
    restart: always  # Politique de relance automatique en cas de crash
    ports:
      - "80:80"    # Port HTTP standard (redirection vers HTTPS et challenges ACME)
      - "443:443"  # Port HTTPS sécurisé pour le trafic chiffré
    volumes:
      # Accès en lecture seule au socket Docker sur /tmp/docker.sock requis par nginx-proxy
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # Volumes partagés pour stocker la configuration vhost, les fichiers HTML et les certificats SSL
      - vhosts:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro

  # ----------------------------------------------------------------------------
  # 2. ACME COMPANION (Générateur & Renouveleur automatique de certificats SSL)
  # ----------------------------------------------------------------------------
  nginx-proxy-acme:
    container_name: nginx-proxy-acme
    image: nginxproxy/acme-companion:latest
    restart: unless-stopped
    depends_on:
      - nginx-proxy  # S'assure que le proxy tourne avant d'interagir avec
    environment:
      NGINX_PROXY_CONTAINER: nginx-reverse-proxy
      NGINX_DOCKER_GEN_CONTAINER: nginx-reverse-proxy
      CERTS_UPDATE_INTERVAL: "28800" # Vérification des renouvellements toutes les 8h
    volumes:
      - certs:/etc/nginx/certs:rw
      - vhosts:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ----------------------------------------------------------------------------
  # 3. APPLICATION MARIO BROS (Le conteneur applicatif)
  # ----------------------------------------------------------------------------
  mario-app:
    container_name: mario-app
    image: sabrinatch/mario-app:v1.0.0
    restart: always
    expose:
      - "80"  # Le port est exposé uniquement sur le réseau interne Docker
    environment:
      - VIRTUAL_HOST=dumbsumb.duckdns.org
      - VIRTUAL_PORT=80
      - ACME_HOST=dumbsumb.duckdns.org
      - ACME_EMAIL=sabrina.tchouar1@ynov.com

# ==============================================================================
# VOLUMES PERSISTANTS MANAGÉS PAR DOCKER
# ==============================================================================
volumes:
  vhosts: {}
  html: {}
  certs: {}
  acme: {}