# ==============================================================================
# DOCKER COMPOSE - ENVIRONNEMENT DE PRODUCTION
# ==============================================================================
# Ce fichier orchestre le déploiement complet de l'application Mario Bros
# avec un Reverse Proxy Nginx, la gestion automatique des certificats SSL/TLS,
# une API de gestion des scores et sa base de données PostgreSQL.
#
# Les variables (${...}) sont lues depuis le fichier .env (voir .env.example).
# ==============================================================================

services:

  # ----------------------------------------------------------------------------
  # 1. REVERSE PROXY NGINX (Point d'entrée unique de la VM)
  # ----------------------------------------------------------------------------
  nginx-proxy:
    container_name: nginx-reverse-proxy
    image: nginxproxy/nginx-proxy:latest
    restart: always  # Politique de relance automatique en cas de crash
    ports:
      - "80:80"    # Port HTTP standard (redirection vers HTTPS et challenges ACME)
      - "443:443"  # Port HTTPS sécurisé pour le trafic chiffré
    volumes:
      # Accès en lecture seule au socket Docker sur /tmp/docker.sock requis par nginx-proxy
      - /var/run/docker.sock:/tmp/docker.sock:ro
      # Volumes partagés pour stocker la configuration vhost, les fichiers HTML et les certificats SSL
      - vhosts:/etc/nginx/vhost.d # Configuration des vhosts
      - html:/usr/share/nginx/html # partage le répertoire web pour les challenges ACME
      - certs:/etc/nginx/certs:ro # Certificats SSL/TLS générés par ACME
    networks:
      - frontend

  # ----------------------------------------------------------------------------
  # 2. ACME COMPANION (Générateur & Renouveleur automatique de certificats SSL)
  # ----------------------------------------------------------------------------
  nginx-proxy-acme:
    container_name: nginx-proxy-acme
    image: nginxproxy/acme-companion:latest
    restart: unless-stopped
    depends_on:
      - nginx-proxy  # S'assure que le proxy tourne avant d'interagir avec
    environment:
      NGINX_PROXY_CONTAINER: nginx-reverse-proxy # pour indiquer à ACME quel conteneur recharger pour mettre à jour les certificats
      NGINX_DOCKER_GEN_CONTAINER: nginx-reverse-proxy # pour indiquer à ACME quel conteneur génère la configuration docker.
      CERTS_UPDATE_INTERVAL: "28800" # Vérification des renouvellements toutes les 8h
    volumes:
      - certs:/etc/nginx/certs:rw # Accès au répertoire des certificats pour les renouveler
      - vhosts:/etc/nginx/vhost.d # Configuration des vhosts
      - html:/usr/share/nginx/html # partage le répertoire web pour les challenges ACME
      - acme:/etc/acme.sh # Répertoire de stockage des certificats générés par ACME
      - /var/run/docker.sock:/var/run/docker.sock:ro # accès au socket Docker
    networks:
      - frontend

  # ----------------------------------------------------------------------------
  # 3. APPLICATION MARIO BROS (Le conteneur applicatif)
  # ----------------------------------------------------------------------------
  # Sert le jeu et relaie /api/ vers l'API des scores (voir nginx/default.conf).
  mario-app:
    container_name: mario-app
    build: .
    image: sabrinatch/mario-app:v1.1.0
    restart: always
    expose:
      - "80"  # Le port est exposé uniquement sur le réseau interne Docker
    environment:
      - VIRTUAL_HOST=${DOMAIN:-dumbsumb.duckdns.org} #indique à nginx-proxy le nom de domaine pour lequel il doit générer un vhost
      - VIRTUAL_PORT=80 #indique à nginx-proxy le port sur lequel l'application écoute (ici 80)
      - ACME_HOST=${DOMAIN:-dumbsumb.duckdns.org} #indique à ACME le nom de domaine pour lequel il doit générer un certificat SSL/TLS
      - ACME_EMAIL=${ACME_EMAIL:-sabrina.tchouar1@ynov.com} #indique à ACME l'adresse email pour recevoir les notifications de renouvellement de certificat
    depends_on:
      - api
    networks:
      - frontend   # joignable par le reverse proxy
      - backend    # peut joindre l'API

  # ----------------------------------------------------------------------------
  # 4. API DES SCORES (Node.js / Express)
  # ----------------------------------------------------------------------------
  # Pas de VIRTUAL_HOST : l'API n'est jamais exposée directement, uniquement
  # via mario-app sur le réseau "backend".
  api:
    container_name: mario-api
    build: ./api
    image: sabrinatch/mario-api:v1.0.0
    restart: always
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-mario}
      PGUSER: ${POSTGRES_USER:-mario}
      PGPASSWORD: ${POSTGRES_PASSWORD:Définir POSTGRES_PASSWORD dans le fichier .env}
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy #blocage de l'API tant que la base de données n'est pas prête à accepter des connexions
    networks:
      - backend

  # ----------------------------------------------------------------------------
  # 5. BASE DE DONNÉES DES SCORES (PostgreSQL)
  # ----------------------------------------------------------------------------
  # Aucun port publié : la base n'est accessible que depuis le réseau "backend".
  db:
    container_name: mario-db
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mario}
      POSTGRES_USER: ${POSTGRES_USER:-mario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:Définir POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"] #test de santé pour vérifier que la base de données est prête à accepter des connexions
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

# ==============================================================================
# RÉSEAUX
# ==============================================================================
# frontend : reverse proxy <-> application
# backend  : application <-> API <-> base de données (isolé, sans accès Internet)
networks:
  frontend: {}
  backend:
    internal: true

# ==============================================================================
# VOLUMES PERSISTANTS MANAGÉS PAR DOCKER
# ==============================================================================
volumes:
  vhosts: {}
  html: {}
  certs: {}
  acme: {}
  pgdata: {}   # données PostgreSQL (scores)
