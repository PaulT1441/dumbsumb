# Configuration Nginx du conteneur mario-app
# - sert les fichiers statiques du jeu
# - relaie /api/ vers le conteneur de l'API des scores (même origine, pas de CORS)

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # En-têtes de sécurité de base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API des scores
    # Résolution DNS Docker à la requête : Nginx démarre même si l'API n'est pas
    # encore prête, et suit le conteneur s'il est recréé.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $scores_api http://api:3000;
        proxy_pass $scores_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        client_max_body_size  4k;
    }

    # Ressources du jeu (images, sons, musiques) : mise en cache navigateur
    location ~* \.(png|gif|mp3|wav|mid)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
